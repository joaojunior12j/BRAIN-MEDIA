<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Media — OAuth Callback</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1.5rem; color: #222; line-height: 1.6; }
  h1 { margin-bottom: 0.5rem; }
  code { background: #f4f4f4; padding: 0.5rem 0.75rem; display: block; border-radius: 4px; word-break: break-all; margin: 1rem 0; font-size: 0.95rem; }
  .ok { color: #0a7a2a; }
  .err { color: #a00; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <h1>Authorization callback</h1>
  <p id="status">Reading response…</p>
  <div id="result"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const err = params.get('error');
    const errDesc = params.get('error_description');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    if (code) {
      status.innerHTML = '<span class="ok">✓ Authorization received.</span> Copy the code below and paste it into your local setup.';
      result.innerHTML =
        '<p><strong>Authorization code:</strong></p>' +
        '<code id="code">' + code + '</code>' +
        '<button onclick="navigator.clipboard.writeText(document.getElementById(\'code\').textContent)">Copy code</button>';
    } else if (err) {
      status.innerHTML = '<span class="err">✗ Authorization failed.</span>';
      result.innerHTML = '<p><strong>Error:</strong> ' + err + '</p><p>' + (errDesc || '') + '</p>';
    } else {
      status.innerHTML = '<span class="err">No code or error in URL.</span> Open this page via the TikTok OAuth flow.';
    }
  </script>
</body>
</html>
